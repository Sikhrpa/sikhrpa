name: Site Quality & Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege token: this workflow only reads the repo.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies & verify prebuilt Tailwind CSS is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code assets/styles.css

      - name: Run site audit verification suite
        run: python3 scripts/verify_site.py
