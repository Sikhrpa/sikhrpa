name: Daily California Legal & News Update

on:
  schedule:
    # 1. Tuesday at 7:30 AM PDT / 6:30 AM PST (covers weekend + Monday)
    - cron: '30 14 * * 2'
    # 2. Friday at 5:30 PM PDT / 4:30 PM PST (catches Friday afternoon court/DOJ dumps before the weekend)
    - cron: '30 0 * * 6'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Gemini News Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update_news.js

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "SikhRPA News Bot"
          git config --global user.email "bot@sikhrpa.org"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes detected in news archive."
          else
            git commit -m "Automated Bi-Weekly Legal & News Update [skip ci]"
            git push
          fi
